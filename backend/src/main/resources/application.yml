server:
  port: ${PORT:8080}

spring:
  application:
    name: procurement-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/procurementdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false # Enabled dynamically or in Postgres profile
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  data-dir: ${DATA_DIR:../task_kit/Cantill_FullStack_Task_Kit}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.cantill.procurement: INFO
    org.springframework.web: INFO
