version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cantill-postgres
    environment:
      POSTGRES_DB: procurementdb
      POSTGRES_USER: cantill
      POSTGRES_PASSWORD: cantill_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantill -d procurementdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cantill-backend
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/procurementdb
      SPRING_DATASOURCE_USERNAME: cantill
      SPRING_DATASOURCE_PASSWORD: cantill_password
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - ./task_kit/Cantill_FullStack_Task_Kit:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cantill-frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
