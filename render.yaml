services:
  # Backend Service on Render
  - type: web
    name: cantill-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/policies
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: cantill-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # Frontend Service on Render
  - type: web
    name: cantill-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cantill-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cantill-postgres
    plan: free
    databaseName: procurementdb
    user: cantill
